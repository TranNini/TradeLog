# Reachable from other devices (the iPhone); they need the access code once
server.address=0.0.0.0
# 8080 is used by the Vocab app
server.port=8081

# All items live in this file; the pictures are in tradelog.images-dir.
# In Docker all data is in /app/data instead (see the Dockerfile).
spring.datasource.url=jdbc:sqlite:tradelog.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time
spring.datasource.hikari.maximum-pool-size=1
# Runs schema.sql on every start; it only creates the tables that are missing
spring.sql.init.mode=always

tradelog.images-dir=images
# Created on first start; delete it to get a new code (devices then need to log in again)
tradelog.access-code-file=access-code.txt
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# The jar gives every file the same 1980 date, so browsers would keep old copies of app.js
# and style.css. Make them ask for the current file every time.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true
