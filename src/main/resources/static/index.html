<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="TradeLog">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>TradeLog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
    <h1>TradeLog</h1>
    <button id="add" class="primary">+ Add item</button>
</header>

<main>
    <section class="totals">
        <div class="total sold">
            <span class="label">Sold</span>
            <strong id="sold-sum">–</strong>
            <span id="sold-count" class="muted"></span>
        </div>
        <div class="total bought">
            <span class="label">Bought</span>
            <strong id="bought-sum">–</strong>
            <span id="bought-count" class="muted"></span>
        </div>
        <div class="total balance">
            <span class="label">Balance</span>
            <strong id="balance">–</strong>
            <span class="muted">sold − bought</span>
        </div>
    </section>
    <p id="scope" class="scope muted" hidden></p>

    <section class="filters">
        <div class="segmented" id="type-filter">
            <button data-type="" class="active">All</button>
            <button data-type="SOLD">Sold</button>
            <button data-type="BOUGHT">Bought</button>
        </div>
        <select id="category-filter" aria-label="Category">
            <option value="">All categories</option>
        </select>
        <input id="search" type="search" placeholder="Search items…" aria-label="Search">
    </section>

    <ul id="list" class="items"></ul>
    <p id="empty" class="empty" hidden></p>
</main>

<dialog id="editor">
    <form id="item-form">
        <h2 id="editor-title">Add item</h2>

        <div class="segmented type-choice">
            <label><input type="radio" name="type" value="SOLD" checked> Sold</label>
            <label><input type="radio" name="type" value="BOUGHT"> Bought</label>
        </div>

        <label>Name
            <input name="name" required autocomplete="off">
        </label>
        <div class="row">
            <label>Price (€)
                <input name="price" type="text" inputmode="decimal" placeholder="e.g. 1,50" autocomplete="off" required>
            </label>
            <label>Date
                <input name="date" type="date">
            </label>
        </div>
        <label><span id="place-label">Where sold</span>
            <input name="place" list="places" placeholder="e.g. eBay, Vinted, flea market" autocomplete="off">
        </label>
        <label>Category
            <input name="category" list="categories" placeholder="e.g. Clothes, Electronics" autocomplete="off">
        </label>
        <label>Notes
            <textarea name="notes" rows="2"></textarea>
        </label>

        <div class="picture">
            <div id="preview" class="thumb large"></div>
            <div class="picture-buttons">
                <label class="button">Choose picture
                    <input id="picture" type="file" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
                </label>
                <button type="button" id="remove-picture">Remove picture</button>
            </div>
        </div>

        <p id="form-error" class="error" hidden></p>

        <div class="actions">
            <button type="button" id="delete" class="danger">Delete</button>
            <span class="spacer"></span>
            <button type="button" id="cancel">Cancel</button>
            <button type="submit" class="primary">Save</button>
        </div>
    </form>
</dialog>

<dialog id="viewer">
    <img id="viewer-image" alt="">
</dialog>

<datalist id="categories"></datalist>
<datalist id="places"></datalist>

<script src="app.js"></script>
</body>
</html>
